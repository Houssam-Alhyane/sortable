<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superhero Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HERO MODAL -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-box">
        <button class="modal-close" id="modal-close">✕</button>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <div class="container">
      <header>
        <h1>HERO<span>BASE</span></h1>
        <p class="subtitle">731 superheroes · searchable · sortable</p>
      </header>

      <!-- SEARCH BAR -->
      <div class="search-bar">
        <select id="search-field">
          <option value="name">Name</option>
          <option value="fullName">Full Name</option>
          <option value="race">Race</option>
          <option value="gender">Gender</option>
          <option value="alignment">Alignment</option>
          <option value="placeOfBirth">Place of Birth</option>
        </select>
        <select id="search-operator">
          <option value="include">include</option>
          <option value="exclude">exclude</option>
          <option value="fuzzy">fuzzy</option>
          <option value="equal">=</option>
          <option value="notEqual">≠</option>
          <option value="gt">&gt;</option>
          <option value="lt">&lt;</option>
        </select>
        <input
          type="text"
          id="search"
          placeholder="Search heroes..."
          autocomplete="off"
        />
        <select id="page-size">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">All</option>
        </select>
      </div>

      <!-- STATS BAR -->
      <div class="stats-bar">
        <span id="result-count">Loading...</span>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-column="image">Icon</th>
              <th data-column="name">Name</th>
              <th data-column="fullName">Full Name</th>
              <th data-column="intelligence">INT</th>
              <th data-column="strength">STR</th>
              <th data-column="speed">SPD</th>
              <th data-column="durability">DUR</th>
              <th data-column="power">PWR</th>
              <th data-column="combat">CMB</th>
              <th data-column="race">Race</th>
              <th data-column="gender">Gender</th>
              <th data-column="height">Height</th>
              <th data-column="weight">Weight</th>
              <th data-column="placeOfBirth">Place of Birth</th>
              <th data-column="alignment">Alignment</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="pagination">
        <button id="prev">← Prev</button>
        <span id="page-info"></span>
        <button id="next">Next →</button>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
